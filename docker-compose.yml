version: '3.8'

# AUDIT FIX (H8, 2026-07-02):
#   Previously hardcoded credentials were committed to version control:
#     POSTGRES_PASSWORD=metardu_secure_2024
#     AUTH_SECRET=dev-auth-secret-32-chars-long-or-more-needed-for-nextauth
#     WORKER_SECRET=dev-worker-secret
#   These are now read from a .env file (gitignored). Copy .env.example
#   to .env and fill in strong random values before running:
#     cp .env.example .env
#     # Edit .env — generate secrets with: openssl rand -base64 32
#     docker compose up -d
#
#   IMPORTANT: If you previously deployed with the old hardcoded values,
#   you MUST rotate them:
#     1. Generate new secrets (see .env.example for commands)
#     2. Update .env on the production server
#     3. Restart all services: docker compose down && docker compose up -d
#     4. The POSTGRES_PASSWORD change requires recreating the postgres
#        volume OR running ALTER USER to change the password in-place.

services:
  metardu-postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: metardu-postgres
    # No host port mapping — only accessible within Docker network.
    # For local debugging, temporarily add: ports: ["127.0.0.1:5432:5432"]
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-metardu}
      - POSTGRES_USER=${POSTGRES_USER:-metardu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metardu} -d ${POSTGRES_DB:-metardu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped

  # Redis for caching, rate limiting, session store, and real-time pub/sub.
  metardu-redis:
    image: redis:7-alpine
    container_name: metardu-redis
    expose:
      - "6379"
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  metardu-worker:
    build:
      context: ./python_worker
    container_name: metardu-worker
    # No host port mapping — only accessible within Docker network
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - WORKER_SECRET=${WORKER_SECRET:?WORKER_SECRET must be set in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  metardu-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost/build
        AUTH_SECRET: build-placeholder-not-used-at-runtime
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://metardu.space}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
    container_name: metardu-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-metardu}:${POSTGRES_PASSWORD}@metardu-postgres:5432/${POSTGRES_DB:-metardu}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:3001/ws/collaboration}
      - PYTHON_COMPUTE_URL=http://metardu-worker:8000
      - WORKER_SECRET=${WORKER_SECRET:?WORKER_SECRET must be set in .env}
      - REDIS_URL=redis://metardu-redis:6379
      - HOSTNAME=0.0.0.0
      - DISABLE_PWA=${DISABLE_PWA:-false}
      - NODE_ENV=production
      # PayPal recurring subscriptions (server-side; hydrated from .env)
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PAYPAL_PLAN_PRO=${PAYPAL_PLAN_PRO:-}
      - PAYPAL_PLAN_TEAM=${PAYPAL_PLAN_TEAM:-}
      - PAYPAL_PLAN_FIRM=${PAYPAL_PLAN_FIRM:-}
      - PAYPAL_PLAN_ENTERPRISE=${PAYPAL_PLAN_ENTERPRISE:-}
      # NVIDIA NIM AI (Survey Assistant, report generation, field-photo OCR)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    depends_on:
      metardu-postgres:
        condition: service_healthy
      metardu-worker:
        condition: service_healthy
      metardu-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  metardu-collaboration:
    build:
      context: .
      dockerfile: Dockerfile.collaboration
    container_name: metardu-collaboration
    # CMD is defined in Dockerfile.collaboration as ["node", "collabEntry.js"]
    # Do NOT override command here — the compiled entrypoint handles everything.
    expose:
      - "3001"
    environment:
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://metardu-redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      metardu-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: on-failure:5

  # AUDIT FIX (H7, 2026-07-02): Backup sidecar runs backup.sh daily.
  # Backups are written to the `backups` volume (mount to host for
  # offsite copy). Configure via env vars:
  #   BACKUP_CRON="0 2 * * *"        (cron schedule, default daily 02:00 UTC)
  #   BACKUP_RETENTION=30            (days to keep backups)
  #   GPG_RECIPI=admin@metardu.org   (optional: encrypt backups with GPG)
  #   BACKUP_OFFSITE_DIR=/offsite    (optional: copy to secondary location)
  metardu-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: metardu-backup
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-metardu}:${POSTGRES_PASSWORD}@metardu-postgres:5432/${POSTGRES_DB:-metardu}
      - BACKUP_DIR=/backups
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-30}
      - GPG_RECIPI=${GPG_RECIPI:-}
      - BACKUP_OFFSITE_DIR=${BACKUP_OFFSITE_DIR:-}
      - BACKUP_LOG_FILE=/var/log/backup.log
    volumes:
      - backups:/backups
      - ./backups:/host-backups:ro  # optional: copy to host ./backups
    depends_on:
      metardu-postgres:
        condition: service_healthy
    restart: unless-stopped

  # P0-6 (2026-07-24): NTRIP WebSocket Proxy.
  # Browsers cannot open raw TCP sockets to NTRIP casters (RTCM
  # correction streams for GNSS rovers), so this WebSocket-to-TCP
  # bridge is required for any in-browser RTK workflow.
  #
  # The proxy listens on port 8090 (ws://host:8090/ntrip). The Next.js
  # app's NTRIPClientPanel connects here. Configure the caster
  # allowlist via NTRIP_ALLOWED_HOSTS (comma-separated). If unset,
  # all hosts are allowed (useful for dev; restrict in production).
  #
  # Health check: GET http://host:8090/health → { status, connections, allowedHosts }
  metardu-ntrip:
    build:
      context: .
      dockerfile: Dockerfile.ntrip
    container_name: metardu-ntrip
    ports:
      - "${NTRIP_PORT:-8090}:8090"
    environment:
      - PORT=8090
      - ALLOWED_HOSTS=${NTRIP_ALLOWED_HOSTS:-}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backups:
