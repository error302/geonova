# ═══════════════════════════════════════════════════════════════════════════
# METARDU — PostgreSQL Production Configuration
# ═══════════════════════════════════════════════════════════════════════════
# Optimized for:
#   - 2-4 GB RAM container allocation
#   - Survey computation workloads (heavy reads, moderate writes)
#   - PostGIS spatial queries (GiST indexes, geometry operations)
#   - Concurrent users: 10-50 surveyors
#   - SSD storage (Docker volumes)
#
# Mount this file into the container:
#   volumes:
#     - ./postgres-custom.conf:/etc/postgresql/postgresql.conf:ro
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# Generated: 2026-07-28
# ═══════════════════════════════════════════════════════════════════════════

# ─── Connection Settings ──────────────────────────────────────────────────
# Max connections: 100 is sufficient for METARDU's Docker stack
# (app pool + worker + backup + migration runner + admin tools)
max_connections = 100
superuser_reserved_connections = 3

# ─── Memory Settings ──────────────────────────────────────────────────────
# shared_buffers: 25% of container memory (2GB container → 256MB)
# This is the primary PostgreSQL memory cache for table/index data.
shared_buffers = 256MB

# effective_cache_size: 75% of container memory (2GB container → 1536MB)
# Tells the query planner how much memory is available for disk caching
# (shared_buffers + OS cache). Affects index vs seqscan decisions.
effective_cache_size = 1536MB

# work_mem: Memory per sort/hash operation before spilling to disk.
# 16MB is generous for survey computations (coordinate transforms,
# traverse adjustments with large observation sets).
# WARNING: Each connection can use work_mem × number_of_sorts simultaneously.
# With 100 connections, worst case = 100 × 16MB = 1.6GB. Monitor carefully.
work_mem = 16MB

# maintenance_work_mem: Memory for VACUUM, CREATE INDEX, ALTER TABLE.
# 128MB speeds up index creation on large observation tables.
maintenance_work_mem = 128MB

# huge_pages: Try to use huge pages if the OS supports them.
# Reduces TLB misses for large shared_buffers. Set to 'try' (not 'on')
# to gracefully fall back.
huge_pages = try

# ─── Write-Ahead Log (WAL) ───────────────────────────────────────────────
# Optimized for moderate write throughput with crash safety.

# wal_buffers: WAL write buffer. Default is 1/32 of shared_buffers.
# 8MB is good for bursty writes (batch observation imports).
wal_buffers = 8MB

# checkpoint_completion_target: Spread checkpoint I/O over this fraction
# of the checkpoint interval. 0.9 = smooth writes, less I/O spikes.
checkpoint_completion_target = 0.9

# max_wal_size: WAL size before forced checkpoint.
# 1GB allows plenty of headroom for large batch operations
# (e.g., importing a full survey day's observations).
max_wal_size = 1GB

# min_wal_size: Minimum WAL to keep for recycling.
min_wal_size = 256MB

# checkpoint_timeout: Force checkpoint at least this often.
# 10min is a good balance between recovery time and I/O overhead.
checkpoint_timeout = 10min

# ─── Query Planner ────────────────────────────────────────────────────────
# Tuned for SSD storage and survey query patterns.

# random_page_cost: Cost of non-sequential disk page fetch.
# SSD: 1.1 (nearly as fast as sequential). HDD: 4.0 (default).
# This makes the planner prefer index scans over seqscans on SSD.
random_page_cost = 1.1

# effective_io_concurrency: Number of concurrent disk I/O operations.
# SSD: 200 (high parallelism). HDD: 2 (default).
effective_io_concurrency = 200

# default_statistics_target: Sample size for ANALYZE.
# 100 (default) is fine. Increase to 200+ if you have very large
# observation tables and the planner makes bad choices.
default_statistics_target = 100

# enable_seqscan: Keep enabled. Disabling forces index scans which
# can be slower for small tables (common in survey metadata).
# enable_seqscan = on  # default

# ─── Parallel Query Execution ─────────────────────────────────────────────
# PostgreSQL can parallelize large scans and aggregations.

# max_worker_processes: Total background workers (including autovacuum).
max_worker_processes = 8

# max_parallel_workers_per_gather: Workers per single query node.
# 2 is conservative — avoids starving other queries.
max_parallel_workers_per_gather = 2

# max_parallel_workers: Total workers available for parallel queries.
max_parallel_workers = 4

# max_parallel_maintenance_workers: Workers for VACUUM and CREATE INDEX.
max_parallel_maintenance_workers = 2

# ─── Logging ──────────────────────────────────────────────────────────────
# Production logging: slow queries + connection events.

# Log queries slower than 250ms. Survey computations should be <100ms.
log_min_duration_statement = 250

# Log format: include timestamp, PID, user, database.
log_line_prefix = '%m [%p] %u@%d '

# Log checkpoints (useful for diagnosing WAL pressure).
log_checkpoints = on

# Log connections (audit trail for database access).
log_connections = on
log_disconnections = on

# Log lock waits (diagnose contention during concurrent survey edits).
log_lock_waits = on
deadlock_timeout = 1s

# Log temp file usage (spills from work_mem overflows).
log_temp_files = 1024  # Log temp files > 1MB

# Don't log statements from roles (avoids noisy migration logs).
# log_statement = 'none'  # default

# ─── Autovacuum ───────────────────────────────────────────────────────────
# Survey tables have mixed patterns:
#   - observations: high insert, moderate update (corrections applied)
#   - projects: low insert, moderate update
#   - audit_trail: append-only (insert only)

# autovacuum_max_workers: Parallel vacuum workers.
# 3 workers handle the mixed table sizes well.
autovacuum_max_workers = 3

# autovacuum_naptime: Check interval between vacuum runs.
# 30s ensures dead tuples don't pile up during heavy imports.
autovacuum_naptime = 30s

# Per-table tuning (set via ALTER TABLE in migrations):
# ALTER TABLE observations SET (autovacuum_vacuum_scale_factor = 0.05);
# ALTER TABLE observations SET (autovacuum_analyze_scale_factor = 0.02);
# ALTER TABLE survey_audit_trail SET (autovacuum_vacuum_scale_factor = 0.01);
# (audit_trail is append-only — vacuum rarely needed but analyze is)

# ─── PostGIS Specific ─────────────────────────────────────────────────────
# PostGIS spatial queries benefit from GiST indexes.
# No special postgresql.conf settings needed, but ensure:
#   - shared_preload_libraries includes 'postgis' (already in postgis image)
#   - GiST indexes on geometry columns (create in migrations)

# ─── Security ─────────────────────────────────────────────────────────────
# Password encryption (default, but explicit).
password_encryption = scram-sha-256

# SSL: Managed by the Docker network — Postgres doesn't need SSL
# for container-to-container communication. If exposing externally,
# enable ssl and configure certificates.
ssl = off

# ─── Locale and Encoding ──────────────────────────────────────────────────
# UTF-8 is required for multilingual support (14 languages).
# Set during database creation — these are defaults for the postgis image.
# lc_messages = 'en_US.UTF-8'

# ─── Statement Timeout ────────────────────────────────────────────────────
# Per-statement timeout to prevent runaway queries.
# 30s is generous for any single computation. Bulk imports should use
# COPY and batched INSERTs.
statement_timeout = '30s'

# idle_in_transaction_session_timeout: Kill connections sitting idle
# in a transaction for too long (prevents lock holding).
idle_in_transaction_session_timeout = '5min'

# ─── JIT (Just-In-Time Compilation) ──────────────────────────────────────
# JIT can speed up complex analytical queries (e.g., area computation
# over thousands of coordinates). Disable if CPU is constrained.
jit = on
jit_above_cost = 100000
