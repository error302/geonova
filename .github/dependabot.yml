# Dependabot configuration — P3-10 (2026-07-24)
# Keeps dependencies updated with weekly checks. Each ecosystem has
# its own schedule so PRs don't all land on the same day.
#
# Security updates (critical/high CVEs) are always opened immediately
# regardless of this schedule — this config is for routine version bumps.

version: 2

updates:
  # npm — production + dev dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Group minor/patch updates to reduce PR noise
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major version bumps get individual PRs for careful review
    ignore:
      # Don't auto-bump Next.js major (14→15 needs manual migration)
      - dependency-name: next
        update-types: major
      # Don't auto-bump React major (18→19 needs concurrent features audit)
      - dependency-name: react
        update-types: major
      - dependency-name: react-dom
        update-types: major
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)

  # GitHub Actions — keep workflow actions pinned to latest
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)

  # Docker — keep base images updated
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore(docker)
