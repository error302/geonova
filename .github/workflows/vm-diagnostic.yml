name: VM Diagnostics (temporary)

# Temporary read-only diagnostic workflow (added 2026-08-30).
# Runs a fixed set of NON-MUTATING commands on the production VM via the
# existing VM_SSH_KEY secret. Prints env var NAMES only — never values.
# This workflow is deleted after the diagnostics are complete.

on:
  workflow_dispatch:

concurrency:
  group: vm-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only production diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Pin VM host key
        run: |
          if [ -n "${{ secrets.VM_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VM_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Run read-only diagnostics on VM
        run: |
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'DIAG'
          set -uo pipefail
          cd "$HOME/metardu" || { echo "NO APP DIR"; exit 1; }

          echo "### git state ###"
          git log --oneline -3 2>/dev/null
          echo "--- local changes (would be wiped by reset --hard): ---"
          git status --short | head -10
          echo "(end local changes)"

          echo "### containers ###"
          docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'

          echo "### host services ###"
          for s in nginx cloudflared docker; do
            printf '%s: %s\n' "$s" "$(systemctl is-active $s 2>/dev/null || echo n/a)"
          done

          echo "### cloudflared container network mode ###"
          docker inspect metardu-cloudflared --format '{{.HostConfig.NetworkMode}}' 2>/dev/null || echo "no metardu-cloudflared container"

          echo "### cloudflared ingress target ###"
          (docker exec metardu-cloudflared sh -c 'cat /etc/cloudflared/config.yml 2>/dev/null || cat /home/opc/.cloudflared/config.yml 2>/dev/null' 2>/dev/null \
            || cat "$HOME/.cloudflared/config.yml" 2>/dev/null) | grep -iE 'service:|ingress' | head -5 || echo "(config not found in usual paths)"

          echo "### nginx proxy targets (if any) ###"
          grep -rsE 'proxy_pass|listen ' /etc/nginx/conf.d/ /etc/nginx/sites-enabled/ /etc/nginx/nginx.conf 2>/dev/null | head -10 || echo "(no nginx config found)"

          echo "### disk / memory ###"
          df -h / | tail -1
          free -h | head -2

          echo "### health endpoints ###"
          printf 'local : %s\n' "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3000/api/public/health || echo err)"
          printf 'public: %s\n' "$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 https://metardu.space/api/public/health || echo err)"

          echo "### env files present ###"
          ls -la .env .env.local 2>/dev/null || true

          echo "### env var NAMES in .env (values never printed) ###"
          for f in .env .env.local; do
            if [ -f "$f" ]; then
              echo "-- $f --"
              grep -oE '^[A-Za-z_][A-Za-z0-9_]*' "$f" | sort | tr '\n' ' '
              echo
            fi
          done

          echo "### key vars set? ###"
          for v in API_ADMIN_KEY PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET PAYPAL_MODE PAYPAL_WEBHOOK_ID NTRIP_ALLOWED_HOSTS NTRIP_PROXY_SECRET NEXT_PUBLIC_COLLAB_SIGNALING_URL ADMIN_EMAILS PLATFORM_OWNER_EMAIL STORAGE_ROOT; do
            if grep -qE "^${v}=" .env 2>/dev/null; then echo "$v: SET"; else echo "$v: missing"; fi
          done

          echo "### ntrip proxy recent log ###"
          docker logs --tail 5 metardu-ntrip 2>&1 | tail -5 || echo "(no ntrip container)"

          echo "### app container health ###"
          docker inspect metardu-app --format '{{.State.Health.Status}} (restarts: {{.RestartCount}})' 2>/dev/null || echo "(no app container)"

          echo "### paypal webhook ids (ids only, fetched with on-VM creds) ###"
          PP_ID=$(grep -E '^PAYPAL_CLIENT_ID=' .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          PP_SECRET=$(grep -E '^PAYPAL_CLIENT_SECRET=' .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          PP_MODE=$(grep -E '^PAYPAL_MODE=' .env 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          if [ -n "$PP_ID" ] && [ -n "$PP_SECRET" ]; then
            API_HOST="api-m.${PP_MODE:-sandbox}.paypal.com"
            TOKEN=$(curl -s -X POST "https://${API_HOST}/v1/oauth2/token" \
              -u "$PP_ID:$PP_SECRET" -d 'grant_type=client_credentials' \
              | python3 -c 'import sys,json
          try: print(json.load(sys.stdin).get("access_token",""))
          except Exception: print("")' 2>/dev/null)
            if [ -n "$TOKEN" ]; then
              curl -s "https://${API_HOST}/v1/notifications/webhooks" \
                -H "Authorization: Bearer $TOKEN" \
                | python3 -c 'import sys,json
          try:
              d=json.load(sys.stdin)
              ws=d.get("webhooks",[])
              if not ws: print("(no webhooks registered)")
              for w in ws:
                  print(w.get("id"), w.get("url"))
          except Exception as e: print("parse error:", e)' 2>/dev/null || true
            else
              echo "(could not obtain paypal token — check creds/mode)"
            fi
          else
            echo "(paypal not configured in .env)"
          fi

          echo "### done ###"
          DIAG
