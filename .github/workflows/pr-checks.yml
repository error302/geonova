name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Type Check, Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # origin/<base> must exist for the changed-files lint gate diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      # Changed-files gate (PR-only: the base ref resolves from
      # GITHUB_BASE_REF → origin/<base> inside the script). Fast ~30s
      # regression check — fails when HEAD adds warnings beyond the base ref
      # in any changed file, including the per-family floors (auto-loaded
      # from the committed baselines). The whole-repo ratchet below is the
      # slow, blocking per-rule baseline.
      - name: Lint changed files (blocking, zero new warnings)
        run: node scripts/lint-gate.mjs --paths-from-changed
      # API ROW-TYPING GATE (2026-08-06): api-row-sweep --check blocks any
      # PR/push that touches a route.ts file containing an untyped
      # db.query/client.query (the any-rows pattern the row-typing grind has
      # been removing). Base ref resolves from CI env exactly like lint-gate:
      # pull_request -> origin/<base>, push -> event.before, else HEAD~1. It is
      # a pure git-diff + route-file scan (no eslint pass), so it runs in
      # seconds alongside the changed-files gate.
      - name: API row-typing gate (blocking, no untyped queries in touched routes)
        run: node scripts/api-row-sweep.mjs --check

      # AUDIT FIX (2026-08-04): Single blocking lint pass. lint-ratchets.mjs
      # runs eslint once over middleware.ts + src/ and fails if ANY rule in
      # warning-baseline.json or a11y-baseline.json is exceeded. A rule
      # absent from a baseline counts as 0, so new violations fail CI.
      #
      # --report prints per-rule drift tables (committed-at-HEAD vs baseline vs
      # live count, Δ since last commit) to the Actions log on every PR, so
      # per-family lint movement is visible without a manual run.
      - name: ESLint (per-rule ratchets — one pass, both baselines, prints drift tables)
        run: node scripts/lint-ratchets.mjs --write-audit --report

      - name: Aria-label gate (blocking, bans junk accessible names)
        # A11Y GATE (2026-08-03): bans placeholder-like / junk aria-labels
        # codebase-wide (placeholder-equals-name, generic phrases, punctuation,
        # crunched header text). Pure-node regex scan over src/ — no deps.
        run: node scripts/aria-label-gate.mjs

      - name: i18n integrity check
        run: node scripts/i18n-sync.mjs --check

      - name: Production build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ''
          DISABLE_PWA: 'true'
        run: npx next build
        timeout-minutes: 12

      - name: Run tests
        # AUDIT FIX (2026-07-05): Add --coverage so the coverageThreshold
        # config in jest.config.js is enforced.
        run: npx jest --silent --coverage --coverageReporters=text-summary --passWithNoTests
        timeout-minutes: 5

      # AUDIT FIX (2026-08-03): the static export can only contain pages that
      # are renderable without a server. API routes, dynamic web routes and
      # server-backed pages (searchParams/cookies/db at render time) cannot be
      # statically exported — they are stashed by scripts/mobile-build.mjs
      # (same pattern as the ci.yml mobile job) and restored afterwards.
      - name: Build static export (MOBILE_BUILD=true)
        run: node scripts/mobile-build.mjs
      - name: Verify static export exists
        run: |
          test -d out && echo "✓ static export OK"
          test -f out/index.html && echo "✓ index.html present"

  axe-sweep:
    # A11Y GATE (2026-08-04): axe-core WCAG sweep across every /tools/* page.
    # Mirrors the ci.yml job of the same name. Blocks on ANY axe violation
    # (--fail-on minor) and on any route that fails to hydrate/scan.
    # Protected routes (/fieldbook, /admin*) are excluded — they need a
    # seeded Postgres + login which this job does not provision.
    name: Axe-core WCAG Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth 0 so origin/main exists locally: the sweep diffs against it
      # to scan only routes touched by this PR (~30s vs ~5min for the full 90).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Start Next.js dev server (headless)
        env:
          NEXT_PUBLIC_SENTRY_DSN: ''
          DISABLE_PWA: 'true'
        run: |
          # nohup+disown: the server must survive the step shell exiting,
          # or the later scan step sees no listener. Teardown uses pkill on
          # the real `next` process (killing the npx wrapper PID alone would
          # orphan the server).
          # Supervised boot: the wrapper restarts `next dev` if it dies
          # mid-sweep (OOM / runner hiccup), so the sweep's recovery wait
          # (axe-gnss-scan.mjs) finds the server back instead of failing.
          nohup bash -c 'while true; do npx next dev -p 3100; sleep 3; done' > /tmp/axe-dev.log 2>&1 &
          disown || true
          echo $! > /tmp/axe-dev.pid
          # -m 20 caps a hung first compile so the poll can't burn the job budget.
          for i in $(seq 1 60); do
            if curl -sf -m 20 http://localhost:3100/tools > /dev/null 2>&1; then
              echo "dev server ready after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start:"
          cat /tmp/axe-dev.log
          exit 1
      # PR fast path: only routes touched by changed files. Falls back to the
      # full sweep when a PR touches global files (globals.css / layouts /
      # shared components with no page importer) — the gate never skips pages.
      - name: Run axe-core WCAG sweep (blocking — fails on any violation)
        env:
          AXE_SCAN_PORT: '3100'
        run: node scripts/axe-gnss-scan.mjs --ci --fail-on minor --no-baseline --paths-from-changed origin/main --exclude fieldbook,admin --concurrency 6
      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-sweep-report
          path: axe-sweep-report.md
          retention-days: 7
      - name: Stop dev server
        if: always()
        run: |
          kill $(cat /tmp/axe-dev.pid) 2>/dev/null || true
          pkill -f 'next dev -p 3100' 2>/dev/null || true
