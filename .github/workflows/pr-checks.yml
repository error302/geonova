name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Type Check, Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint (per-rule ratchets — one pass, both baselines)
        # AUDIT FIX (2026-08-04): Single blocking lint pass. lint-ratchets.mjs
        # runs eslint once over middleware.ts + src/ and fails if ANY rule in
        # warning-baseline.json or a11y-baseline.json is exceeded. A rule
        # absent from a baseline counts as 0, so new violations fail CI.
        run: node scripts/lint-ratchets.mjs --write-audit

      - name: i18n integrity check
        run: node scripts/i18n-sync.mjs --check

      - name: Production build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ''
          DISABLE_PWA: 'true'
        run: npx next build
        timeout-minutes: 12

      - name: Run tests
        # AUDIT FIX (2026-07-05): Add --coverage so the coverageThreshold
        # config in jest.config.js is enforced.
        run: npx jest --silent --coverage --coverageReporters=text-summary --passWithNoTests
        timeout-minutes: 5

      - name: Verify mobile static export
        env:
          MOBILE_BUILD: 'true'
          NEXT_PUBLIC_SENTRY_DSN: ''
          DISABLE_PWA: 'true'
        run: |
          npx next build
          test -d out && echo "✓ mobile static export OK"
