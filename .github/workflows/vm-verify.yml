name: VM Verify Deploy (temporary)

# Temporary read-only post-deploy verification (2026-08-30).
# Confirms the security remediation is live: deployed commit, container
# health, applied migrations, and that /api/metrics now requires the
# admin key at the app level (audit H-13). Deleted after verification.

on:
  workflow_dispatch:

jobs:
  verify:
    name: Read-only post-deploy verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Pin VM host key
        run: |
          if [ -n "${{ secrets.VM_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VM_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Verify deployment on VM
        run: |
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'VERIFY'
          set -uo pipefail
          cd "$HOME/metardu" || exit 1

          echo "### deployed commit ###"
          git log --oneline -2

          echo "### containers ###"
          docker ps --filter "name=metardu-" --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'

          echo "### app health (local, bypasses Cloudflare) ###"
          curl -s --max-time 10 http://localhost:3000/api/public/health | head -c 200
          echo

          echo "### H-13 check: /api/metrics without key (expect 401) ###"
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 10 http://localhost:3000/api/metrics

          echo "### H-13 check: /api/public/metrics without key (expect 401) ###"
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 10 http://localhost:3000/api/public/metrics

          echo "### migrations: last 6 applied (version names only) ###"
          docker exec metardu-postgres psql -U metardu -d metardu -t -A \
            -c "SELECT version || ' @ ' || applied_at FROM schema_migrations ORDER BY version DESC LIMIT 6" 2>&1 | head -8

          echo "### H-01 check: unique index on payment_history.provider_id exists? ###"
          docker exec metardu-postgres psql -U metardu -d metardu -t -A \
            -c "SELECT indexname FROM pg_indexes WHERE tablename='payment_history' AND indexdef LIKE '%UNIQUE%provider_id%'" 2>&1 | head -2

          echo "### C-06 check: users.email_verified column exists? ###"
          docker exec metardu-postgres psql -U metardu -d metardu -t -A \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='users' AND column_name='email_verified'" 2>&1 | head -2

          echo "### H-05 check: background_jobs.created_by column exists? ###"
          docker exec metardu-postgres psql -U metardu -d metardu -t -A \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='background_jobs' AND column_name='created_by'" 2>&1 | head -2

          echo "### app container last errors (if any) ###"
          docker logs --tail 200 metardu-app 2>&1 | grep -iE "error|fatal|unhandled" | tail -5 || echo "(no errors in recent logs)"

          echo "### done ###"
          VERIFY
